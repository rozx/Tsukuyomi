name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      # write permission is required to create a github release
      contents: write
      # write permission is required for autolabeler
      # otherwise, read permission is required at least
      pull-requests: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      release_created: ${{ steps.set_final_outputs.outputs.release_created }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Extract version from branch name
        id: extract_version
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          # Try to get branch name from associated PR
          BRANCH_NAME=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/pulls --jq '.[0].head.ref' 2>/dev/null || echo "")

          # If no PR found, try to extract from current ref (in case of direct push)
          if [ -z "$BRANCH_NAME" ] || [ "$BRANCH_NAME" == "null" ]; then
            BRANCH_NAME="${{ github.ref_name }}"
          fi

          echo "Source branch: $BRANCH_NAME"

          # Extract version from branch name (support patterns like: release/0.5.15, v0.5.15, 0.5.15-release, 0.9.0.55 etc.)
          VERSION=$(echo "$BRANCH_NAME" | grep -oE '[v]?[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?' | head -1 || echo "")

          if [ -z "$VERSION" ]; then
            echo "No version found in branch name: $BRANCH_NAME"
            echo "version_found=false" >> "$GITHUB_OUTPUT"
          else
            # Remove 'v' prefix if present
            VERSION="${VERSION#v}"
            echo "Extracted version from branch: $VERSION"
            echo "version_found=true" >> "$GITHUB_OUTPUT"
            echo "expected_version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Check and update version
        id: check_version
        if: steps.extract_version.outputs.version_found == 'true' && github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          # Get current version from src/constants/version.ts (Source of Truth for 4-part versions)
          CURRENT_VERSION=$(grep "export const APP_VERSION =" src/constants/version.ts | sed -E "s/.*'([^']+)'.*/\1/")
          EXPECTED_VERSION="${{ steps.extract_version.outputs.expected_version }}"

          echo "Current version in package.json: $CURRENT_VERSION"
          echo "Expected version from branch: $EXPECTED_VERSION"

          # Normalize versions to ensure they have 3 parts (major.minor.patch)
          normalize_version() {
            local ver=$1
            # Remove any pre-release or build metadata
            ver=$(echo "$ver" | sed 's/-.*//' | sed 's/+.*//')
            # Split by dots
            IFS='.' read -r -a parts <<< "$ver"
            # Ensure we have at least 2 parts (major.minor)
            if [ ${#parts[@]} -lt 2 ]; then
              echo "Error: Invalid version format: $ver" >&2
              return 1
            fi
            # Add patch version if missing
            if [ ${#parts[@]} -eq 2 ]; then
              parts+=("0")
            fi
            # Ignore build number if present (keep only major.minor.patch)
            echo "${parts[0]}.${parts[1]}.${parts[2]}"
          }

          CURRENT_VERSION_NORM=$(normalize_version "$CURRENT_VERSION")
          EXPECTED_VERSION_NORM=$(normalize_version "$EXPECTED_VERSION")

          if [ -z "$CURRENT_VERSION_NORM" ] || [ -z "$EXPECTED_VERSION_NORM" ]; then
            echo "❌ Failed to normalize versions"
            exit 1
          fi

          echo "Normalized current version: $CURRENT_VERSION_NORM"
          echo "Normalized expected version: $EXPECTED_VERSION_NORM"

          # Function to compare semantic versions
          # Returns: 0 if v1 == v2, 1 if v1 > v2, 2 if v1 < v2
          compare_versions() {
            local v1=$1
            local v2=$2
            
            # Split versions into major.minor.patch
            IFS='.' read -r -a v1_parts <<< "$v1"
            IFS='.' read -r -a v2_parts <<< "$v2"
            
            # Ensure both versions have 4 parts (major.minor.patch.build)
            while [ ${#v1_parts[@]} -lt 4 ]; do
              v1_parts+=("0")
            done
            while [ ${#v2_parts[@]} -lt 4 ]; do
              v2_parts+=("0")
            done
            
            # Compare major version
            if [ "${v1_parts[0]}" -gt "${v2_parts[0]}" ]; then
              return 1
            elif [ "${v1_parts[0]}" -lt "${v2_parts[0]}" ]; then
              return 2
            fi
            
            # Compare minor version
            if [ "${v1_parts[1]}" -gt "${v2_parts[1]}" ]; then
              return 1
            elif [ "${v1_parts[1]}" -lt "${v2_parts[1]}" ]; then
              return 2
            fi
            
            # Compare patch version
            if [ "${v1_parts[2]}" -gt "${v2_parts[2]}" ]; then
              return 1
            elif [ "${v1_parts[2]}" -lt "${v2_parts[2]}" ]; then
              return 2
            fi

            # Compare build version
            if [ "${v1_parts[3]}" -gt "${v2_parts[3]}" ]; then
              return 1
            elif [ "${v1_parts[3]}" -lt "${v2_parts[3]}" ]; then
              return 2
            fi
            
            return 0
          }

          # Compare versions using normalized versions
          COMPARE_RESULT=0
          compare_versions "$CURRENT_VERSION_NORM" "$EXPECTED_VERSION_NORM" || COMPARE_RESULT=$?

          if [ $COMPARE_RESULT -eq 0 ]; then
            # Versions are equal
            echo "✅ Version matches: $CURRENT_VERSION"
            echo "version_updated=false" >> "$GITHUB_OUTPUT"
            echo "final_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          elif [ $COMPARE_RESULT -eq 1 ]; then
            # Current version is greater than expected version
            echo "ℹ️ Local version ($CURRENT_VERSION) is greater than branch version ($EXPECTED_VERSION)"
            echo "Keeping local version: $CURRENT_VERSION"
            echo "version_updated=false" >> "$GITHUB_OUTPUT"
            echo "final_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          else
            # Expected version is greater than current version
            echo "⚠️ Version mismatch detected!"
            echo "Updating version from $CURRENT_VERSION to $EXPECTED_VERSION"
            
            # Update version using bump script
            echo "Running: bun run bump \"$EXPECTED_VERSION\""
            if ! bun run bump "$EXPECTED_VERSION"; then
              echo "❌ Failed to run bump script"
              exit 1
            fi
            
            # Verify the update by checking version.ts
            NEW_VERSION=$(grep "export const APP_VERSION =" src/constants/version.ts | sed -E "s/.*'([^']+)'.*/\1/")
            NEW_VERSION_NORM=$(normalize_version "$NEW_VERSION")
            EXPECTED_NORM=$(normalize_version "$EXPECTED_VERSION")
            
            if [ "$NEW_VERSION_NORM" == "$EXPECTED_NORM" ]; then
              echo "✅ Version updated successfully to $NEW_VERSION"
              echo "version_updated=true" >> "$GITHUB_OUTPUT"
              echo "final_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
            else
              echo "❌ Failed to update version."
              echo "   Expected: $EXPECTED_VERSION (normalized: $EXPECTED_NORM)"
              echo "   Got: $NEW_VERSION (normalized: $NEW_VERSION_NORM)"
              exit 1
            fi
          fi

      - name: Commit version update
        if: steps.check_version.outputs.version_updated == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          git add package.json src/constants/version.ts
          git commit -m "chore: bump version to ${{ steps.check_version.outputs.final_version }} [skip ci]" || exit 0
          git push origin HEAD:${{ github.ref_name }} || echo "No changes to commit or already up to date"

      - name: Check for release label
        id: check_label
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Manual trigger detected. Treating as release."
            echo "has_release_label=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Get associated PRs for this commit
          LABELS=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }}/pulls --jq '.[].labels[].name' 2>/dev/null || echo "")
          echo "Labels found from commit PRs: $LABELS"
          if echo "$LABELS" | grep -q "release"; then
            echo "has_release_label=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_release_label=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get version from package.json
        id: get_version
        if: steps.check_label.outputs.has_release_label == 'true'
        run: |
          # Use the version from check_version step if available, otherwise read from package.json
          if [ "${{ steps.check_version.outputs.final_version }}" != "" ]; then
            VERSION="${{ steps.check_version.outputs.final_version }}"
            echo "Using version from version check step: $VERSION"
          else
            VERSION=$(jq -r .version package.json)
            # Try to get from version.ts if package.json version is different (implies build number usage)
            VERSION_TS=$(grep "export const APP_VERSION =" src/constants/version.ts | sed -E "s/.*'([^']+)'.*/\1/")
            if [ "$VERSION" != "$VERSION_TS" ]; then
               VERSION="$VERSION_TS"
            fi
            echo "Using version from files: $VERSION"
          fi

          # Strip build number (4th segment) for tag/release: 0.9.0.58 -> 0.9.0
          VERSION=$(echo "$VERSION" | sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+)(\.[0-9]+)?$/\1/')
          echo "Release version (without build number): $VERSION"

          echo "version=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check_tag
        if: steps.check_label.outputs.has_release_label == 'true'
        run: |
          git fetch --tags
          if git rev-parse "${{ steps.get_version.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag ${{ steps.get_version.outputs.version }} already exists"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Tag
        if: steps.check_label.outputs.has_release_label == 'true' && steps.check_tag.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag ${{ steps.get_version.outputs.version }}
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin ${{ steps.get_version.outputs.version }}

      - name: Check and prepare release notes
        id: prepare_release_notes
        if: steps.check_label.outputs.has_release_label == 'true'
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          # Strip build number to get 3-part version (v0.9.0.58 -> v0.9.0)
          VERSION_3PART=$(echo "$VERSION" | sed -E 's/^(v[0-9]+\.[0-9]+\.[0-9]+)(\.[0-9]+)?$/\1/')

          RELEASE_NOTES_FILE="public/releaseNotes/RELEASE_NOTES_${VERSION}.md"
          RELEASE_NOTES_FILE_3PART="public/releaseNotes/RELEASE_NOTES_${VERSION_3PART}.md"

          echo "Checking for release notes file: $RELEASE_NOTES_FILE"
          echo "Fallback 3-part version file: $RELEASE_NOTES_FILE_3PART"

          if [ -f "$RELEASE_NOTES_FILE" ]; then
            echo "✅ Release notes file found (exact match): $RELEASE_NOTES_FILE"
            echo "has_release_notes=true" >> "$GITHUB_OUTPUT"
            echo "release_notes_path=$RELEASE_NOTES_FILE" >> "$GITHUB_OUTPUT"
          elif [ "$RELEASE_NOTES_FILE" != "$RELEASE_NOTES_FILE_3PART" ] && [ -f "$RELEASE_NOTES_FILE_3PART" ]; then
            echo "✅ Release notes file found (3-part version): $RELEASE_NOTES_FILE_3PART"
            echo "has_release_notes=true" >> "$GITHUB_OUTPUT"
            echo "release_notes_path=$RELEASE_NOTES_FILE_3PART" >> "$GITHUB_OUTPUT"
          else
            echo "ℹ️ No release notes file found, will use auto-generated notes"
            echo "has_release_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Refuse to overwrite a published release
        if: steps.check_label.outputs.has_release_label == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.get_version.outputs.version }}
        run: |
          gh api --paginate --slurp "repos/${{ github.repository }}/releases?per_page=100" > /tmp/releases.json
          if jq -e --arg tag "$RELEASE_TAG" '.[][] | select(.tag_name == $tag and .draft == false)' /tmp/releases.json >/dev/null; then
            echo "Published versions are immutable. Bump the patch version before releasing again."
            exit 1
          fi

      - name: Create Release (with release notes file)
        id: create_release
        if: steps.check_label.outputs.has_release_label == 'true' && steps.prepare_release_notes.outputs.has_release_notes == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          body_path: ${{ steps.prepare_release_notes.outputs.release_notes_path }}
          draft: true
          prerelease: false
          make_latest: false
        env:
          # 优先使用 PAT（如果存在），否则使用默认的 GITHUB_TOKEN
          # 对于私有仓库，PAT 通常更可靠
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Create Release (with auto-generated notes)
        id: create_release_auto
        if: steps.check_label.outputs.has_release_label == 'true' && steps.prepare_release_notes.outputs.has_release_notes != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          generate_release_notes: true
          draft: true
          prerelease: false
          make_latest: false
        env:
          # 优先使用 PAT（如果存在），否则使用默认的 GITHUB_TOKEN
          # 对于私有仓库，PAT 通常更可靠
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Set Final Outputs
        id: set_final_outputs
        if: steps.check_label.outputs.has_release_label == 'true'
        run: |
          # Check if either release creation step succeeded
          if [ "${{ steps.create_release.outcome }}" == "success" ] || [ "${{ steps.create_release_auto.outcome }}" == "success" ]; then
            echo "release_created=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_created=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: create-release
    if: needs.create-release.outputs.release_created == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            channel: win-x64
          - os: ubuntu-latest
            channel: linux-x64
          - os: macos-15
            channel: osx-arm64
          - os: macos-15-intel
            channel: osx-x64
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.version }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2 libarchive-tools
      - run: bun install --frozen-lockfile
      - name: Verify version before building
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.create-release.outputs.version }}
        run: |
          bun -e 'if ("v" + require("./package.json").version !== process.env.RELEASE_TAG) process.exit(1)'
      - name: Build portable application and update feed
        run: bun run build:electron
      - name: Verify this platform feed
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.create-release.outputs.version }}
        run: bun scripts/desktop-release.ts verify dist/electron/Releases "${RELEASE_TAG#v}" "${{ matrix.channel }}"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.channel }}
          path: dist/electron/Releases/*
          if-no-files-found: error

  publish:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.create-release.outputs.version }}
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist/electron/Releases
          merge-multiple: true
      - name: Validate all update feeds
        env:
          RELEASE_TAG: ${{ needs.create-release.outputs.version }}
        run: bun scripts/desktop-release.ts verify dist/electron/Releases "${RELEASE_TAG#v}" win-x64 linux-x64 osx-arm64 osx-x64
      - name: Upload and publish complete release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.create-release.outputs.version }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true"
          gh release upload "$RELEASE_TAG" dist/electron/Releases/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
